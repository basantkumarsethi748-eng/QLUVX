plugins {
    id 'com.android.application'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
}

// Safely load .env.example and .env so BuildConfig fields always have valid quoted Java strings
def envProps = new Properties()
def envExampleFile = rootProject.file(".env.example")
if (envExampleFile.exists()) {
    envExampleFile.withInputStream { envProps.load(it) }
}
def envFile = rootProject.file(".env")
if (envFile.exists()) {
    def rawProps = new Properties()
    envFile.withInputStream { rawProps.load(it) }
    rawProps.each { k, v ->
        if (v != null && !v.toString().trim().isEmpty()) {
            envProps.setProperty(k.toString(), v.toString().trim())
        }
    }
}

def safeBuildConfigString = { String key, String fallback ->
    def raw = envProps.getProperty(key, fallback)
    if (raw == null || raw.trim().isEmpty()) {
        raw = fallback
    }
    def cleaned = raw.trim()
    if (cleaned.startsWith('"') && cleaned.endsWith('"') && cleaned.length() >= 2) {
        cleaned = cleaned.substring(1, cleaned.length() - 1)
    }
    cleaned = cleaned.replace("\\", "\\\\").replace("\"", "\\\"")
    return "\"${cleaned}\""
}

android {
    namespace 'com.example.qluvx'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.qluvx"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "AGORA_APP_ID", safeBuildConfigString("AGORA_APP_ID", "YOUR_AGORA_APP_ID")
        buildConfigField "String", "AGORA_TEMP_TOKEN", safeBuildConfigString("AGORA_TEMP_TOKEN", "YOUR_AGORA_TEMP_TOKEN")
        buildConfigField "String", "AGORA_DEFAULT_CHANNEL", safeBuildConfigString("AGORA_DEFAULT_CHANNEL", "qluvx_live_1")
        buildConfigField "String", "AGORA_TOKEN_SERVER_URL", safeBuildConfigString("AGORA_TOKEN_SERVER_URL", "YOUR_AGORA_TOKEN_SERVER_URL")
    }

    signingConfigs {
        debugConfig {
            storeFile file("${rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            storeFile file("${rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debugConfig
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    aaptOptions {
        cruncherEnabled = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

secrets {
    defaultPropertiesFileName = ".env.example"
    ignoreList.add(".*")
}

dependencies {
    // Agora RTC Full SDK (Voice + Live Video PK)
    implementation 'io.agora.rtc:full-sdk:4.3.0'

    // AndroidX & Material UI
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.fragment:fragment:1.8.2'

    // Retrofit 2 & OkHttp 3 REST Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Socket.io Client for Real-Time Chat, Live Comments & PK Score Bar
    implementation('io.socket:socket.io-client:2.1.0') {
        exclude group: 'org.json', module: 'json'
    }

    // Glide Image Loader
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Google Play In-App Billing Library (Coins & VIP Subscriptions)
    implementation 'com.android.billingclient:billing:7.0.0'
}


